name: Publish edge middleware to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run validate
      # Trusted publishing (OIDC): npmjs.com trusts this workflow file in Red-Center-Studio/agent-tollbooth-402,
      # so no npm token is stored anywhere. The publisher may only stage: each new version goes live after the
      # owner approves it on npmjs.com (or `npm stage approve <id>`) with their 2FA.
      - run: npm install -g npm@latest
      - name: Stage for publishing (skips a version that is already on npm)
        working-directory: packages/edge-middleware
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm: nothing to publish."
            exit 0
          fi
          npm stage publish --access public
