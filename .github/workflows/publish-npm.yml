name: Publish edge middleware to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run validate
      # Needs an npm account that owns the @redcenterstudio scope and an NPM_TOKEN repository secret (or a
      # trusted publisher set up on npmjs.com after the first publish). Skipped, not failed, until then.
      - name: Publish with provenance
        working-directory: packages/edge-middleware
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
